<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>陈芷锐 · Portfolio</title>
  <meta name="description" content="陈芷锐 · AI Trainer · 个人作品集">
  <meta name="theme-color" content="#0b0d12">
  <link rel="icon" href="assets/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d12;
      --bg-soft: #11141b;
      --card: rgba(20, 23, 31, 0.88);
      --card-strong: #171a22;
      --text: #f5f7fb;
      --muted: #9ba3b4;
      --quiet: #697184;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #b4ff39;
      --accent-2: #ff7657;
      --blue: #79a8ff;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 78% 8%, rgba(180,255,57,.07), transparent 22rem),
        radial-gradient(circle at 12% 38%, rgba(121,168,255,.055), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body.modal-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    img { max-width: 100%; }
    ::selection { background: var(--accent); color: #10120d; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .shell { width: min(1120px, calc(100% - 48px)); margin-inline: auto; }

    .nav {
      position: fixed;
      z-index: 50;
      top: 18px;
      left: 50%;
      width: min(1120px, calc(100% - 48px));
      height: 58px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 8px 10px 8px 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(11, 13, 18, .72);
      backdrop-filter: blur(18px) saturate(130%);
      box-shadow: 0 10px 38px rgba(0,0,0,.14);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center;
      background: var(--accent); color: #11150b;
      font-family: "Space Grotesk", sans-serif;
    }
    .nav-links { margin-left: auto; display: flex; align-items: center; gap: 2px; }
    .nav-link {
      padding: 10px 11px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
      transition: .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); background: rgba(255,255,255,.055); }
    .icon-btn {
      width: 40px; height: 40px; border: 1px solid var(--line);
      border-radius: 12px; background: transparent; color: var(--muted);
      display: grid; place-items: center; cursor: pointer;
    }
    .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.05); }
    .mobile-toggle { display: none; }

    main { overflow: hidden; }
    .section { position: relative; padding: 112px 0; }
    .section + .section { border-top: 1px solid var(--line); }
    .section-head {
      display: flex; align-items: end; justify-content: space-between;
      gap: 24px; margin-bottom: 34px;
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--accent); font-size: 12px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 28px; height: 1px; background: currentColor; }
    .section-title {
      margin: 10px 0 0; font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      font-size: clamp(38px, 5vw, 62px); line-height: 1.05; letter-spacing: -.045em;
    }
    .section-copy { max-width: 420px; margin: 0; color: var(--muted); line-height: 1.8; }

    .hero {
      min-height: 820px;
      height: min(920px, 100svh);
      display: flex; align-items: center;
      padding: 112px 0 70px;
    }
    .hero-grid {
      display: grid; grid-template-columns: minmax(0, 1.38fr) minmax(320px, .62fr);
      align-items: center; gap: 56px;
    }
    .status-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 34px; padding: 7px 12px;
      border: 1px solid var(--line); border-radius: 999px;
      background: rgba(255,255,255,.035); color: var(--muted); font-size: 12px;
    }
    .status.live { color: var(--accent); border-color: rgba(180,255,57,.24); background: rgba(180,255,57,.07); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px rgba(180,255,57,.7); }
    .hero h1 {
      margin: 0;
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      font-size: clamp(74px, 10vw, 138px);
      line-height: .82;
      letter-spacing: -.075em;
    }
    .hero-role {
      margin: 22px 0 18px;
      color: var(--accent);
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1;
      letter-spacing: -.035em;
    }
    .hero-bio { max-width: 650px; margin: 0; color: var(--muted); font-size: 17px; line-height: 1.85; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .button {
      min-height: 48px; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 12px 18px; border: 1px solid var(--line); border-radius: 13px;
      background: var(--card); color: var(--text); cursor: pointer;
      font-size: 14px; font-weight: 700; transition: .22s ease;
    }
    .button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.18); background: var(--card-strong); }
    .button.primary { background: var(--accent); color: #10130b; border-color: var(--accent); }
    .button.primary:hover { box-shadow: 0 14px 38px rgba(180,255,57,.16); background: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 36px; }
    .stat { min-height: 98px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.025); }
    .stat-value { display: block; font-family: "Space Grotesk", sans-serif; font-size: 29px; line-height: 1; }
    .stat-label { display: block; margin-top: 10px; color: var(--quiet); font-size: 11px; }
    .portrait-wrap { position: relative; }
    .portrait {
      position: relative; aspect-ratio: 4 / 5; width: 100%; overflow: hidden;
      border: 1px solid var(--line); border-radius: 32px;
      background: linear-gradient(145deg, #1b202b, #10131a);
      box-shadow: var(--shadow);
    }
    .portrait img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.88) contrast(1.02); }
    .portrait::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 58%, rgba(7,9,13,.74)); pointer-events: none;
    }
    .portrait-meta { position: absolute; z-index: 2; left: 18px; right: 18px; bottom: 18px; }
    .portrait-meta strong { display: block; font-size: 16px; }
    .portrait-meta span { display: block; margin-top: 5px; color: #cbd1dc; font-size: 12px; }

    .marquee {
      overflow: hidden; border-block: 1px solid var(--line);
      background: rgba(255,255,255,.018);
    }
    .marquee-track { display: flex; width: max-content; padding: 16px 0; animation: ticker 38s linear infinite; }
    .marquee span {
      display: inline-flex; align-items: center; gap: 18px;
      margin-right: 18px; color: var(--muted); font-size: 13px; white-space: nowrap;
    }
    .marquee span::after { content: "◆"; color: var(--accent); font-size: 7px; }
    @keyframes ticker { to { transform: translateX(-50%); } }

    .about-grid { display: grid; grid-template-columns: 1.35fr .65fr; gap: 18px; }
    .card {
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--card); box-shadow: 0 12px 34px rgba(0,0,0,.12);
    }
    .about-main { padding: clamp(28px, 5vw, 48px); }
    .about-main h3 {
      max-width: 720px; margin: 0 0 22px;
      font-family: "Space Grotesk", "Noto Sans SC", sans-serif;
      font-size: clamp(29px, 4vw, 48px); line-height: 1.12; letter-spacing: -.04em;
    }
    .about-main h3 span { color: var(--accent); }
    .about-main p { max-width: 720px; margin: 0; color: var(--muted); line-height: 1.9; }
    .profile-card { padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
    .profile-card-top { display: flex; align-items: center; gap: 12px; }
    .mini-avatar { width: 54px; height: 54px; border-radius: 16px; object-fit: cover; }
    .profile-card strong { display: block; }
    .profile-card small { color: var(--muted); }
    .info-list { margin: 24px 0 0; display: grid; gap: 10px; }
    .info-row { display: flex; justify-content: space-between; gap: 16px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
    .info-row span:first-child { color: var(--quiet); }

    .education-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .education-card { padding: 24px; min-height: 170px; transition: .25s ease; }
    .education-card:hover, .project-card:hover, .skill-card:hover { transform: translateY(-4px); border-color: rgba(180,255,57,.22); }
    .education-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .education-card h3 { margin: 0; font-size: 18px; }
    .education-card .level { margin: 8px 0 18px; color: var(--muted); font-size: 13px; }
    .education-card .score { color: var(--accent); font-family: "Space Grotesk", sans-serif; font-size: 23px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .tag { padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.025); font-size: 11px; }

    .skill-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .skill-card { padding: 22px; transition: .25s ease; }
    .skill-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .skill-name { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
    .skill-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: rgba(180,255,57,.07); color: var(--accent); }
    .skill-level { color: var(--quiet); font-size: 11px; }
    .skill-track { height: 5px; margin: 18px 0 10px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.07); }
    .skill-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--blue)); transform-origin: left; transform: scaleX(0); transition: transform 1s cubic-bezier(.22,1,.36,1); }
    .skill-card.visible .skill-fill { transform: scaleX(var(--width)); }
    .skill-desc { color: var(--quiet); font-size: 12px; }
    .skill-tags { margin-top: 20px; }

    .timeline { display: grid; gap: 12px; }
    .experience-card { display: grid; grid-template-columns: 180px 1fr; gap: 24px; padding: 24px; }
    .experience-card time { color: var(--quiet); font-size: 12px; }
    .experience-card h3 { margin: 0 0 6px; font-size: 18px; }
    .experience-card .org { color: var(--accent); font-size: 12px; }
    .experience-card p { margin: 12px 0 0; color: var(--muted); line-height: 1.75; }
    .experience-card .tags { margin-top: 14px; }

    .certificate-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .certificate-card { overflow: hidden; cursor: pointer; transition: .25s ease; }
    .certificate-card:hover { transform: translateY(-5px); border-color: rgba(180,255,57,.25); }
    .certificate-image { height: 210px; overflow: hidden; border-bottom: 1px solid var(--line); background: #e9eaed; }
    .certificate-image img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
    .certificate-card:hover .certificate-image img { transform: scale(1.025); }
    .certificate-body { padding: 18px; }
    .certificate-body h3 { margin: 0; font-size: 15px; line-height: 1.45; }
    .certificate-body p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 14px; }
    .gallery-card { height: 260px; padding: 0; overflow: hidden; cursor: zoom-in; }
    .gallery-card img { width: 100%; height: 100%; object-fit: cover; }
    .honors-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .honor { min-height: 86px; display: grid; place-items: center; text-align: center; padding: 12px; color: var(--muted); font-size: 12px; }

    .contact-panel {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
      padding: clamp(28px, 5vw, 48px);
    }
    .contact-copy h2 { margin: 0 0 16px; font-family: "Space Grotesk", "Noto Sans SC", sans-serif; font-size: clamp(42px, 7vw, 72px); line-height: 1; letter-spacing: -.055em; }
    .contact-copy h2 span { color: var(--accent); }
    .contact-copy p { max-width: 460px; color: var(--muted); line-height: 1.8; }
    .contact-actions { display: grid; align-content: end; gap: 10px; }
    .contact-action { width: 100%; justify-content: space-between; }

    .game-card { display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; overflow: hidden; }
    .game-copy { padding: clamp(28px, 5vw, 48px); }
    .game-copy h3 { margin: 12px 0; font-size: 32px; }
    .game-copy p { color: var(--muted); line-height: 1.8; }
    .game-preview {
      min-height: 300px; display: grid; place-items: center;
      background: linear-gradient(135deg, rgba(180,255,57,.12), rgba(121,168,255,.08));
      border-left: 1px solid var(--line);
    }
    .game-grid { width: 180px; aspect-ratio: 1; display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; transform: rotate(-8deg); }
    .game-grid i { border: 1px solid rgba(255,255,255,.12); border-radius: 12px; background: rgba(255,255,255,.055); }
    .game-grid i:nth-child(3n) { background: var(--accent); opacity: .75; }

    .footer { display: flex; justify-content: space-between; gap: 20px; padding: 30px 0 44px; color: var(--quiet); font-size: 12px; border-top: 1px solid var(--line); }

    .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .project-card { min-height: 230px; display: flex; flex-direction: column; padding: 24px; }
    .project-card h3 { margin: 0; font-size: 20px; }
    .project-card p { flex: 1; margin: 14px 0 18px; color: var(--muted); line-height: 1.75; }
    .project-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .project-links a { padding: 7px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); font-size: 12px; }
    .fitness-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 18px; }
    .fitness-grid button { height: 72px; padding: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-soft); cursor: zoom-in; }
    .fitness-grid img { width: 100%; height: 100%; object-fit: cover; }

    [data-theme="light"] {
      --bg: #f5f5f7;
      --bg-soft: #ffffff;
      --card: rgba(255, 255, 255, 0.92);
      --card-strong: #ffffff;
      --text: #1d1d1f;
      --muted: #62636a;
      --quiet: #85878e;
      --line: rgba(29, 29, 31, 0.11);
      --shadow: 0 18px 48px rgba(29, 29, 31, 0.09);
    }
    [data-theme="light"] body {
      background:
        radial-gradient(circle at 78% 8%, rgba(35,66,55,.06), transparent 22rem),
        radial-gradient(circle at 12% 38%, rgba(35,66,55,.035), transparent 24rem),
        var(--bg);
    }
    [data-theme="light"] .nav {
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 10px 38px rgba(29,29,31,.08);
    }
    [data-theme="light"] .portrait::after {
      background: linear-gradient(180deg, transparent 58%, rgba(29,29,31,.58));
    }
    [data-theme="light"] .marquee {
      background: rgba(29,29,31,.018);
    }
    [data-theme="light"] .button:hover,
    [data-theme="light"] .project-links a,
    [data-theme="light"] .tag,
    [data-theme="light"] .status {
      background: rgba(29,29,31,.035);
    }
    [data-theme="light"] .button.primary,
    [data-theme="light"] .brand-mark {
      color: #ffffff;
      background: var(--accent);
    }
    [data-theme="light"] .nav-link:hover,
    [data-theme="light"] .nav-link.active,
    [data-theme="light"] .icon-btn:hover {
      background: rgba(29,29,31,.055);
    }

    .modal {
      position: fixed; z-index: 100; inset: 0; display: none;
      align-items: center; justify-content: center; padding: 20px;
      background: rgba(4,5,8,.88); backdrop-filter: blur(14px);
    }
    .modal.open { display: flex; }
    .modal-panel { width: min(960px, 100%); max-height: 92vh; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--card-strong); box-shadow: var(--shadow); }
    .modal-head { height: 58px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); }
    .modal-head strong { font-size: 14px; }
    .modal-body { height: calc(92vh - 58px); display: grid; place-items: center; padding: 18px; }
    .modal-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .game-modal .modal-panel { width: min(1180px, 100%); }
    .game-modal iframe { width: 100%; height: calc(92vh - 58px); border: 0; background: #000; }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    .toast {
      position: fixed; z-index: 120; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
      padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--text); color: var(--bg); opacity: 0; pointer-events: none;
      font-size: 13px; transition: .25s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      .shell, .nav { width: min(100% - 32px, 1120px); }
      .nav { top: 10px; }
      .nav-links {
        position: fixed; top: 78px; left: 16px; right: 16px;
        display: none; flex-direction: column; align-items: stretch;
        padding: 10px; border: 1px solid var(--line); border-radius: 16px;
        background: rgba(11,13,18,.96);
      }
      .nav-links.open { display: flex; }
      .nav-link { padding: 12px; }
      .mobile-toggle { display: grid; }
      .hero { height: auto; min-height: 760px; padding-top: 120px; }
      .hero-grid { grid-template-columns: 1fr 280px; gap: 24px; }
      .hero h1 { font-size: clamp(64px, 12vw, 100px); }
      .certificate-grid { grid-template-columns: repeat(2, 1fr); }
      .education-grid, .skill-grid { grid-template-columns: 1fr 1fr; }
      .project-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 680px) {
      .shell, .nav { width: calc(100% - 24px); }
      .nav { height: 54px; border-radius: 16px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-name { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .nav-links { top: 72px; left: 12px; right: 12px; }
      .section { padding: 82px 0; }
      .section-head { align-items: start; flex-direction: column; }
      .section-title { font-size: 38px; }
      .hero { min-height: auto; padding: 104px 0 52px; }
      .hero-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: clamp(58px, 20vw, 86px); }
      .hero-role { margin-top: 18px; }
      .hero-bio { font-size: 15px; }
      .stats { gap: 7px; }
      .stat { min-height: 86px; padding: 12px 10px; }
      .stat-value { font-size: 24px; }
      .portrait-wrap { max-width: 360px; margin-inline: auto; }
      .about-grid, .contact-panel, .game-card { grid-template-columns: 1fr; }
      .education-grid, .skill-grid, .certificate-grid, .honors-grid { grid-template-columns: 1fr; }
      .project-grid { grid-template-columns: 1fr; }
      .experience-card { grid-template-columns: 1fr; gap: 8px; }
      .certificate-image { height: 230px; }
      .gallery-grid { grid-template-columns: 1fr; }
      .gallery-card { height: 220px; }
      .game-preview { border-left: 0; border-top: 1px solid var(--line); }
      .footer { flex-direction: column; }
      .button { min-height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .reveal { opacity: 1; transform: none; }
    }
    @media print {
      .nav, .marquee, .hero-actions, .modal, .toast, .game-preview, .game-card .button { display: none !important; }
      body { background: #fff; color: #111; }
      .section, .hero { min-height: auto; height: auto; padding: 28px 0; break-inside: avoid; }
      .card, .stat, .status { background: #fff; border-color: #ddd; box-shadow: none; }
      .portrait { box-shadow: none; }
      .reveal { opacity: 1; transform: none; }
      @page { size: A4; margin: 12mm; }
    }
  </style>
</head>
<body>
  <nav class="nav" aria-label="主导航">
    <a class="brand" href="#hero" aria-label="返回顶部">
      <span class="brand-mark" id="brandMark">C</span>
      <span class="brand-name" id="brandName">陈芷锐</span>
    </a>
    <div class="nav-links" id="navLinks">
      <a class="nav-link" href="#about">关于</a>
      <a class="nav-link" href="#projects">项目</a>
      <a class="nav-link" href="#education">教育</a>
      <a class="nav-link" href="#skills">技能</a>
      <a class="nav-link" href="#experience">经历</a>
      <a class="nav-link" href="#certificates">证书</a>
      <a class="nav-link" href="#contact">联系</a>
    </div>
    <button class="icon-btn" id="printBtn" type="button" title="打印或导出 PDF" aria-label="打印或导出 PDF">PDF</button>
    <button class="icon-btn mobile-toggle" id="mobileToggle" type="button" aria-label="展开菜单">菜单</button>
  </nav>

  <main id="app"></main>

  <div class="modal" id="certificateModal" role="dialog" aria-modal="true" aria-label="证书查看">
    <div class="modal-panel">
      <div class="modal-head">
        <strong id="certificateTitle">证书查看</strong>
        <button class="icon-btn" type="button" onclick="closeCertificate()">关闭</button>
      </div>
      <div class="modal-body"><img id="certificateImage" src="" alt="证书大图"></div>
    </div>
  </div>
  <div class="modal game-modal" id="gameModal" role="dialog" aria-modal="true" aria-label="游戏作品">
    <div class="modal-panel">
      <div class="modal-head">
        <strong id="gameTitle">作品展示</strong>
        <button class="icon-btn" type="button" onclick="closeGame()">关闭</button>
      </div>
      <iframe id="gameFrame" title="游戏作品" src=""></iframe>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    let CONFIG = null;
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);
    const el = (tag, className, html) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (html !== undefined) node.innerHTML = html;
      return node;
    };

    async function init() {
      try {
        const response = await fetch("config.json");
        if (!response.ok) throw new Error("config");
        CONFIG = await response.json();
      } catch (error) {
        document.getElementById("app").innerHTML = '<div class="shell section"><h1>内容加载失败</h1><p>请确认 config.json 可以访问。</p></div>';
        return;
      }

      applyTheme(CONFIG.theme);
      document.title = CONFIG.site?.title || CONFIG.profile?.name || "Portfolio";
      document.querySelector('meta[name="description"]').setAttribute("content", CONFIG.site?.description || "");
      document.getElementById("brandName").textContent = CONFIG.profile.name;
      document.getElementById("brandMark").textContent = CONFIG.profile.name?.[0] || "C";

      const app = document.getElementById("app");
      app.appendChild(renderHero(CONFIG));
      app.appendChild(renderMarquee(CONFIG.marquee || []));
      app.appendChild(renderAbout(CONFIG.about || {}));
      app.appendChild(renderProjects(CONFIG.projects || []));
      app.appendChild(renderEducation(CONFIG.education || []));
      app.appendChild(renderSkills(CONFIG.skills || [], CONFIG.skillTags || []));
      app.appendChild(renderExperience(CONFIG.experience || []));
      app.appendChild(renderCertificates(CONFIG.certificates || {}, CONFIG.honors || []));
      app.appendChild(renderGame(CONFIG.game || {}));
      app.appendChild(renderContact(CONFIG.profile || {}, CONFIG.footer || {}));
      setupReveal();
    }

    function applyTheme(theme = {}) {
      const root = document.documentElement;
      const hex = String(theme.bg || "").replace("#", "");
      const color = hex.length === 6
        ? [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)]
        : [11,13,18];
      const luminance = (color[0] * 299 + color[1] * 587 + color[2] * 114) / 1000;
      root.dataset.theme = luminance > 170 ? "light" : "dark";
      if (theme.bg) root.style.setProperty("--bg", theme.bg);
      if (theme.bg2) root.style.setProperty("--bg-soft", theme.bg2);
      if (theme.surface) root.style.setProperty("--card", theme.surface);
      if (theme.text) root.style.setProperty("--text", theme.text);
      if (theme.textDim) root.style.setProperty("--muted", theme.textDim);
      if (theme.accent) root.style.setProperty("--accent", theme.accent);
      if (theme.accent2) root.style.setProperty("--accent-2", theme.accent2);
    }

    function renderHero(config) {
      const profile = config.profile || {};
      const section = el("section", "hero");
      section.id = "hero";
      section.innerHTML = `
        <div class="shell hero-grid reveal">
          <div>
            <div class="status-row">
              <span class="status live"><span class="status-dot"></span>${escapeHtml(profile.status || "可联系")}</span>
              ${(profile.badges || []).map(badge => `<span class="status">${escapeHtml(badge)}</span>`).join("")}
            </div>
            <h1>${escapeHtml(profile.name || "")}</h1>
            <p class="hero-role">${escapeHtml(profile.title || "")}</p>
            <p class="hero-bio">${escapeHtml(profile.bio || "")}</p>
            <div class="hero-actions">
              <a class="button primary" href="mailto:${escapeHtml(profile.email || "")}">发送邮件</a>
              <button class="button" type="button" data-copy="${escapeHtml(profile.phone || "")}" data-label="电话">复制电话</button>
              <a class="button" href="#certificates">查看证书</a>
            </div>
            <div class="stats">
              ${(config.stats || []).map(stat => `
                <div class="stat">
                  <span class="stat-value">${escapeHtml(stat.value)}${escapeHtml(stat.suffix || "")}</span>
                  <span class="stat-label">${escapeHtml(stat.label)}</span>
                </div>`).join("")}
            </div>
          </div>
          <div class="portrait-wrap">
            <div class="portrait">
              <img src="${escapeHtml(profile.avatar || "")}" alt="${escapeHtml(profile.name || "")}">
              <div class="portrait-meta">
                <strong>${escapeHtml(profile.name || "")}</strong>
                <span>${escapeHtml(profile.title || "")} · 中国</span>
              </div>
            </div>
          </div>
        </div>`;
      section.querySelectorAll("[data-copy]").forEach(button => {
        button.addEventListener("click", () => copyText(button.dataset.copy, button.dataset.label));
      });
      return section;
    }

    function renderMarquee(items) {
      const marquee = el("div", "marquee");
      const track = el("div", "marquee-track");
      const content = items.map(item => `<span>${escapeHtml(item.text)}</span>`).join("");
      track.innerHTML = content + content;
      marquee.appendChild(track);
      return marquee;
    }

    function sectionHead(label, title, copy = "") {
      const head = el("div", "section-head");
      head.innerHTML = `
        <div><span class="eyebrow">${escapeHtml(label)}</span><h2 class="section-title">${escapeHtml(title)}</h2></div>
        ${copy ? `<p class="section-copy">${escapeHtml(copy)}</p>` : ""}`;
      return head;
    }

    function renderAbout(config) {
      const section = el("section", "section");
      section.id = "about";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("About", "个人简介"));
      const grid = el("div", "about-grid reveal");
      grid.innerHTML = `
        <article class="card about-main">
          <h3>${escapeHtml(config.heading || "")}<br><span>${escapeHtml(config.headingHighlight || "")}</span> ${escapeHtml(config.headingSuffix || "")}</h3>
          <p>${escapeHtml(config.description || "")}</p>
        </article>
        <aside class="card profile-card">
          <div>
            <div class="profile-card-top">
              <img class="mini-avatar" src="${escapeHtml(config.card?.avatar || CONFIG.profile.avatar)}" alt="${escapeHtml(config.card?.name || CONFIG.profile.name)}">
              <div><strong>${escapeHtml(config.card?.name || CONFIG.profile.name)}</strong><small>${escapeHtml(config.card?.role || "")}</small></div>
            </div>
            <div class="info-list">
              ${(config.card?.info || []).map(info => `<div class="info-row"><span>${escapeHtml(info.label)}</span><span>${escapeHtml(info.value)}</span></div>`).join("")}
            </div>
            ${config.fitness?.photos?.length ? `
              <div class="fitness-grid">
                ${config.fitness.photos.map(photo => `
                  <button type="button" data-photo="${escapeHtml(photo.src)}" data-photo-title="${escapeHtml(photo.alt || config.fitness.label || "健身照片")}">
                    <img src="${escapeHtml(photo.src)}" alt="${escapeHtml(photo.alt || "")}">
                  </button>`).join("")}
              </div>` : ""}
          </div>
        </aside>`;
      grid.querySelectorAll("[data-photo]").forEach(button => {
        button.addEventListener("click", () => openCertificate(button.dataset.photo, button.dataset.photoTitle));
      });
      shell.appendChild(grid);
      section.appendChild(shell);
      return section;
    }

    function renderProjects(projects) {
      if (!projects.length) return el("div");
      const section = el("section", "section");
      section.id = "projects";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Projects", "项目作品"));
      const grid = el("div", "project-grid reveal");
      projects.forEach(project => {
        const card = el("article", "card project-card");
        card.innerHTML = `
          <h3>${escapeHtml(project.title)}</h3>
          <p>${escapeHtml(project.summary)}</p>
          <div class="project-links">
            ${(project.links || []).map(link => {
              const url = escapeHtml(link.href);
              return /^https?:\/\//i.test(link.href || "") ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label)} ↗</a>` : "";
            }).join("")}
          </div>`;
        grid.appendChild(card);
      });
      shell.appendChild(grid);
      section.appendChild(shell);
      return section;
    }

    function renderEducation(items) {
      const section = el("section", "section");
      section.id = "education";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Education", "教育经历"));
      const grid = el("div", "education-grid reveal");
      items.forEach(item => {
        const card = el("article", "card education-card");
        card.innerHTML = `
          <div class="education-top">
            <h3>${escapeHtml(item.school)}</h3>
            ${item.pill ? `<span class="tag" style="color:${escapeHtml(item.pill.color)}">${escapeHtml(item.pill.label)}</span>` : (item.badge ? `<span class="tag">${escapeHtml(item.badge)}</span>` : "")}
          </div>
          ${item.score ? `<p class="level"><span class="score">${escapeHtml(item.score)}</span> 分</p>` : `<p class="level">${escapeHtml(item.level || "")}</p>`}
          ${item.tags?.length ? `<div class="tags">${item.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}`;
        grid.appendChild(card);
      });
      shell.appendChild(grid);
      section.appendChild(shell);
      return section;
    }

    function renderSkills(skills, tags) {
      const section = el("section", "section");
      section.id = "skills";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Skills", "核心能力"));
      const grid = el("div", "skill-grid reveal");
      skills.forEach(skill => {
        const card = el("article", "card skill-card");
        card.style.setProperty("--width", String((skill.width || 0) / 100));
        card.innerHTML = `
          <div class="skill-top">
            <div class="skill-name"><span class="skill-icon">${escapeHtml(skill.icon?.[0]?.toUpperCase() || "A")}</span>${escapeHtml(skill.name)}</div>
            <span class="skill-level">${escapeHtml(skill.level)}</span>
          </div>
          <div class="skill-track"><div class="skill-fill"></div></div>
          <div class="skill-desc">${escapeHtml(skill.desc)}</div>`;
        grid.appendChild(card);
      });
      shell.appendChild(grid);
      if (tags.length) {
        const tagWrap = el("div", "tags skill-tags reveal");
        tags.forEach(tag => tagWrap.appendChild(el("span", "tag", escapeHtml(tag))));
        shell.appendChild(tagWrap);
      }
      section.appendChild(shell);
      return section;
    }

    function renderExperience(items) {
      const section = el("section", "section");
      section.id = "experience";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Experience", "实践经历"));
      const timeline = el("div", "timeline reveal");
      items.forEach(item => {
        const card = el("article", "card experience-card");
        card.innerHTML = `
          <div><time>${escapeHtml(item.date || "长期")}</time></div>
          <div>
            <h3>${escapeHtml(item.title)}</h3>
            <span class="org">${escapeHtml(item.org || "")}</span>
            <p>${escapeHtml(item.description || "")}</p>
            ${item.tags?.length ? `<div class="tags">${item.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>` : ""}
          </div>`;
        timeline.appendChild(card);
      });
      shell.appendChild(timeline);
      section.appendChild(shell);
      return section;
    }

    function renderCertificates(certificates, honors) {
      const section = el("section", "section");
      section.id = "certificates";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Certificates", "证书与荣誉"));
      const cards = certificates.cards || [];
      const grid = el("div", "certificate-grid reveal");
      cards.forEach(cert => {
        const card = el("article", "card certificate-card");
        card.innerHTML = `
          <div class="certificate-image"><img src="${escapeHtml(cert.img)}" alt="${escapeHtml(cert.title)}"></div>
          <div class="certificate-body"><h3>${escapeHtml(cert.title)}</h3><p>${escapeHtml(cert.issuer)}</p></div>`;
        card.addEventListener("click", () => openCertificate(cert.img, cert.title));
        grid.appendChild(card);
      });
      shell.appendChild(grid);

      if (certificates.gallery?.length) {
        const gallery = el("div", "gallery-grid reveal");
        certificates.gallery.forEach(item => {
          const card = el("article", "card gallery-card");
          card.innerHTML = `<img src="${escapeHtml(item.img)}" alt="${escapeHtml(item.title)}">`;
          card.addEventListener("click", () => openCertificate(item.img, item.title));
          gallery.appendChild(card);
        });
        shell.appendChild(gallery);
      }
      if (honors.length) {
        const honorGrid = el("div", "honors-grid reveal");
        honors.forEach(honor => honorGrid.appendChild(el("article", "card honor", escapeHtml(honor.title))));
        shell.appendChild(honorGrid);
      }
      section.appendChild(shell);
      return section;
    }

    function renderGame(game) {
      if (!game.title) return el("div");
      const section = el("section", "section");
      section.id = "play";
      const shell = el("div", "shell");
      shell.appendChild(sectionHead("Game", "互动作品"));
      const card = el("div", "card game-card reveal");
      card.innerHTML = `
        <div class="game-copy">
          <span class="status">${escapeHtml(game.badge || "Interactive")}</span>
          <h3>${escapeHtml(game.title)}</h3>
          <p>${escapeHtml(game.description)}</p>
          <div class="tags">${(game.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
          <button class="button primary" type="button" style="margin-top:18px" id="openGameBtn">${escapeHtml(game.button || "进入作品")}</button>
        </div>
        <div class="game-preview" aria-hidden="true"><div class="game-grid">${"<i></i>".repeat(16)}</div></div>`;
      card.querySelector("#openGameBtn").addEventListener("click", openGame);
      shell.appendChild(card);
      section.appendChild(shell);
      return section;
    }

    function renderContact(profile, footer) {
      const section = el("section", "section");
      section.id = "contact";
      const shell = el("div", "shell");
      const panel = el("div", "card contact-panel reveal");
      panel.innerHTML = `
        <div class="contact-copy">
          <span class="eyebrow">Contact</span>
          <h2>让我们<span>聊聊</span>。</h2>
          <p>欢迎交流 AI 训练、智能体开发、活动组织与项目协作机会。</p>
        </div>
        <div class="contact-actions">
          <button class="button contact-action" type="button" data-copy="${escapeHtml(profile.phone || "")}" data-label="电话"><span>电话</span><strong>${escapeHtml(profile.phone || "")}</strong></button>
          <button class="button contact-action" type="button" data-copy="${escapeHtml(profile.email || "")}" data-label="邮箱"><span>邮箱</span><strong>${escapeHtml(profile.email || "")}</strong></button>
        </div>`;
      panel.querySelectorAll("[data-copy]").forEach(button => {
        button.addEventListener("click", () => copyText(button.dataset.copy, button.dataset.label));
      });
      shell.appendChild(panel);
      const foot = el("footer", "footer");
      foot.innerHTML = `<span>${escapeHtml(footer.copyright || "")}</span><a href="admin.html">内容管理</a>`;
      shell.appendChild(foot);
      section.appendChild(shell);
      return section;
    }

    function setupReveal() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("visible");
          observer.unobserve(entry.target);
        });
      }, { threshold: 0.12 });
      document.querySelectorAll(".reveal, .skill-card").forEach(node => observer.observe(node));

      const sections = [...document.querySelectorAll("main section[id]")];
      const links = [...document.querySelectorAll(".nav-link")];
      window.addEventListener("scroll", () => {
        let current = "hero";
        sections.forEach(section => {
          if (window.scrollY >= section.offsetTop - 180) current = section.id;
        });
        links.forEach(link => link.classList.toggle("active", link.getAttribute("href") === "#" + current));
      }, { passive: true });
    }

    async function copyText(text, label) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        showToast(`${label}已复制`);
      } catch {
        const input = document.createElement("textarea");
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
        showToast(`${label}已复制`);
      }
    }
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function openCertificate(src, title) {
      document.getElementById("certificateImage").src = src;
      document.getElementById("certificateTitle").textContent = title || "证书查看";
      document.getElementById("certificateModal").classList.add("open");
      document.body.classList.add("modal-open");
    }
    function closeCertificate() {
      document.getElementById("certificateModal").classList.remove("open");
      document.getElementById("certificateImage").src = "";
      document.body.classList.remove("modal-open");
    }
    function openGame() {
      document.getElementById("gameTitle").textContent = CONFIG.game?.title || "作品展示";
      document.getElementById("gameFrame").src = CONFIG.game?.src || "tank-battle.html";
      document.getElementById("gameModal").classList.add("open");
      document.body.classList.add("modal-open");
    }
    function closeGame() {
      document.getElementById("gameModal").classList.remove("open");
      document.getElementById("gameFrame").src = "";
      document.body.classList.remove("modal-open");
    }

    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("mobileToggle").addEventListener("click", () => {
      document.getElementById("navLinks").classList.toggle("open");
    });
    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", () => document.getElementById("navLinks").classList.remove("open"));
    });
    document.querySelectorAll(".modal").forEach(modal => {
      modal.addEventListener("click", event => {
        if (event.target !== modal) return;
        if (modal.id === "certificateModal") closeCertificate();
        if (modal.id === "gameModal") closeGame();
      });
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") { closeCertificate(); closeGame(); }
    });

    init();
  </script>
</body>
</html>
