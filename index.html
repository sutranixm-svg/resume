<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历</title>
<meta name="description" content="个人简历">
<link rel="icon" href="assets/avatar.jpg">
<style>
:root {
  --bg: #fafafa;
  --paper: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --line: #e5e7eb;
  --accent: #0f4c5c;
  --accent-soft: #e7f1f3;
  --todo: #9a3412;
  --todo-bg: #fff7ed;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
a { color: var(--accent); }
button, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(250, 250, 250, 0.94);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 960px;
  margin: 0 auto;
  padding: 8px 20px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
}
.nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
}
.nav a:hover { color: var(--accent); }
.print-btn {
  margin-left: auto;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--text);
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 13px;
  cursor: pointer;
}
.print-btn:hover { border-color: var(--accent); color: var(--accent); }

.sheet {
  max-width: 960px;
  margin: 24px auto 40px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  padding: 28px 32px 22px;
}
.identity {
  padding-bottom: 14px;
  margin-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.name {
  margin: 0;
  font-size: 28px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #111827;
}
.target {
  margin: 2px 0 0;
  color: var(--accent);
  font-weight: 600;
}
.meta { margin: 2px 0 0; }
.contacts {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  font-size: 13px;
}
.contacts a, .side-list a { color: var(--accent); text-decoration: none; }
.contacts a:hover, .side-list a:hover { text-decoration: underline; }
.contacts li, .side-list li { display: flex; align-items: center; gap: 6px; }
.icon { width: 14px; height: 14px; flex: 0 0 auto; display: block; }

.layout {
  display: grid;
  grid-template-columns: minmax(200px, 30%) minmax(0, 1fr);
  column-gap: 32px;
  align-items: start;
}
.photo { grid-column: 1; grid-row: 1; margin: 0 0 14px; }
.side { grid-column: 1; grid-row: 2; }
.main { grid-column: 2; grid-row: 1 / span 2; }
.photo img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  border-radius: 2px;
}

.block { margin: 0 0 16px; }
.block h2 {
  margin: 0 0 8px;
  padding-bottom: 3px;
  border-bottom: 1px solid #d7e4e7;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
}
.summary { margin: 0; }

.project + .project,
.exp + .exp,
.edu + .edu { margin-top: 11px; }
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
}
h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.45; }
.stack, .date, .org { color: var(--muted); font-size: 12.5px; }
.stack, .date { white-space: nowrap; }
.org { margin: 0; }
.project p, .exp p, .edu p { margin: 2px 0 0; }
.repo { font-size: 12.5px; word-break: break-all; }

.tags, .side-list, .honors, .certs { margin: 0; padding: 0; list-style: none; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  background: var(--accent-soft);
  color: var(--accent);
  border-radius: 999px;
  padding: 0 8px;
  font-size: 12px;
  line-height: 1.7;
}
.skill-name { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.skill-group + .skill-group { margin-top: 8px; }
.side-list li { margin: 0 0 3px; font-size: 13px; word-break: break-all; }
.certs { font-size: 13px; }
.cert-btn {
  display: block;
  width: 100%;
  margin: 0;
  padding: 5px 0;
  border: 0;
  border-bottom: 1px solid #f3f4f6;
  background: transparent;
  color: inherit;
  text-align: left;
  font: inherit;
  line-height: 1.5;
  cursor: pointer;
}
.cert-btn:hover { color: var(--accent); }
.honors li { font-size: 13px; padding: 1px 0 1px 12px; position: relative; }
.honors li::before {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  position: absolute;
  left: 0;
  top: 0.72em;
}
.game-link { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.footer {
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}
.todo {
  color: var(--todo);
  background: var(--todo-bg);
  border-radius: 2px;
  padding: 0 3px;
}
.gallery {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.gallery button {
  padding: 0;
  border: 1px solid var(--line);
  background: #fff;
  cursor: pointer;
}
.gallery img { width: 100%; height: 72px; object-fit: cover; display: block; }
.gallery figcaption { font-size: 11px; color: var(--muted); padding: 2px 4px 4px; }

.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(17, 24, 39, 0.78);
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.viewer.open { display: flex; }
.viewer-card { max-width: min(960px, 100%); max-height: 100%; }
.viewer img { max-width: 100%; max-height: calc(100vh - 96px); display: block; background: #fff; }
.viewer-close {
  display: block;
  margin: 0 0 8px auto;
  border: 0;
  background: #fff;
  color: var(--text);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
.error { max-width: 960px; margin: 40px auto; padding: 0 20px; }

@media (max-width: 640px) {
  .nav-inner { padding: 8px 16px; }
  .print-btn { margin-left: 0; }
  .sheet { margin: 0; border-left: 0; border-right: 0; padding: 18px 16px 24px; }
  .name { font-size: 24px; letter-spacing: 0.04em; }
  .layout { display: flex; flex-direction: column; }
  .side-col { display: contents; }
  .photo { order: 1; margin-bottom: 16px; }
  .main { order: 2; }
  .side { order: 3; }
  .photo img { width: 112px; height: 112px; }
  .row { flex-wrap: wrap; }
  .stack, .date { white-space: normal; }
}

@media print {
  .no-print { display: none !important; }
  body { background: #fff; font-size: 11.5px; line-height: 1.38; }
  .sheet {
    max-width: none;
    margin: 0;
    border: 0;
    padding: 0;
  }
  a { color: inherit; text-decoration: none; }
  .layout { grid-template-columns: 32% minmax(0, 1fr); }
  .tags, .tag { display: inline; }
  .tag {
    background: none;
    color: inherit;
    padding: 0;
    border-radius: 0;
    font-size: inherit;
  }
  .tag:not(:last-child)::after { content: "、"; }
  .photo { margin-bottom: 6px; }
  .photo img { width: 24mm; height: 24mm; }
  .identity { margin-bottom: 8px; padding-bottom: 6px; }
  .block { margin-bottom: 8px; }
  .block h2 { margin-bottom: 4px; }
  .project + .project, .exp + .exp, .edu + .edu { margin-top: 5px; }
  .name { font-size: 20px; }
  h3 { font-size: 13px; }
  .side-contact { display: none !important; }
  .todo { background: none; color: inherit; padding: 0; }
  .project, .exp, .edu, .skill-group, .cert-btn, .honors { break-inside: avoid; }
  h2, h3 { break-after: avoid; }
  @page { size: A4; margin: 10mm; }
}
</style>
</head>
<body>
<nav class="nav no-print" aria-label="页面目录">
  <div class="nav-inner">
    <a href="#summary">简介</a>
    <a href="#projects">项目</a>
    <a href="#experience">经历</a>
    <a href="#education">教育</a>
    <a href="#skills">技能</a>
    <a href="#certs">证书</a>
    <a href="#honors">荣誉</a>
    <button type="button" class="print-btn" onclick="window.print()">打印</button>
  </div>
</nav>
<div id="app"></div>
<div class="viewer no-print" id="viewer" role="dialog" aria-modal="true" aria-label="图片预览">
  <div class="viewer-card">
    <button type="button" class="viewer-close" id="viewerClose">关闭</button>
    <img id="viewerImg" alt="">
  </div>
</div>
<script>
const ICONS = {
  phone: '<path d="M6.5 4.5h2.2l1.2 3-1.7 1a12.5 12.5 0 0 0 5.8 5.8l1-1.7 3 1.2v2.2a1.5 1.5 0 0 1-1.6 1.5A15.5 15.5 0 0 1 4.5 6.1 1.5 1.5 0 0 1 6 4.5z"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="1.5"/><path d="M4 7l8 6 8-6"/>',
  github: '<path fill="currentColor" stroke="none" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-.88-.01-1.73-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.36 1.12 2.94.86.09-.67.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.35 9.35 0 0 1 12 6.84c.85 0 1.7.12 2.5.34 1.9-1.33 2.74-1.05 2.74-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.48-.01 2.81 0 .27.18.59.69.49A10.05 10.05 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>'
};

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatText(value) {
  return escapeHtml(value).replace(/TODO：(?:(?!TODO：)[^。\n])*/g, (match) => `<span class="todo">${match}</span>`);
}

function safeUrl(url) {
  const value = String(url ?? '').trim();
  if (/^(https?:\/\/|mailto:|tel:)/i.test(value)) return value;
  if (/^(assets\/|tank-battle\.html)[\w./-]*$/.test(value)) return value;
  return '';
}

function icon(name) {
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

function el(tag, className, html) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html !== undefined) node.innerHTML = html;
  return node;
}

function shortUrl(url) {
  return String(url || '').replace(/^https?:\/\//, '');
}

function certItems(certificates) {
  if (Array.isArray(certificates)) return certificates;
  return (certificates && (certificates.items || certificates.cards)) || [];
}

async function init() {
  const app = document.getElementById('app');
  let config;
  try {
    const response = await fetch('config.json');
    if (!response.ok) throw new Error(response.statusText);
    config = await response.json();
  } catch (error) {
    app.appendChild(el('p', 'error', '简历内容加载失败，请确认 config.json 可以访问。'));
    return;
  }

  document.title = config.site?.title || '简历';
  const description = document.querySelector('meta[name="description"]');
  if (description && config.site?.description) description.setAttribute('content', config.site.description);

  const sheet = el('main', 'sheet');
  sheet.appendChild(renderIdentity(config.profile || {}));

  const layout = el('div', 'layout');
  const sideCol = el('aside', 'side-col');
  sideCol.appendChild(renderPhoto(config.profile || {}));
  const side = el('div', 'side');
  side.appendChild(renderSideContact(config.profile || {}));
  side.appendChild(renderSkills(config.skillGroups || []));
  side.appendChild(renderCertificates(certItems(config.certificates)));
  side.appendChild(renderHonors(config.honors || []));
  side.appendChild(renderGallery((config.certificates && config.certificates.gallery) || []));
  sideCol.appendChild(side);

  const main = el('div', 'main');
  main.appendChild(renderSummary(config.profile || {}));
  main.appendChild(renderProjects(config.projects || []));
  main.appendChild(renderExperience(config.experience || []));
  main.appendChild(renderEducation(config.education || []));
  main.appendChild(renderGame(config.game));
  layout.appendChild(sideCol);
  layout.appendChild(main);

  sheet.appendChild(layout);
  sheet.appendChild(renderFooter(config.footer || {}));
  app.appendChild(sheet);
}

function renderIdentity(profile) {
  const header = el('header', 'identity');
  header.appendChild(el('h1', 'name', escapeHtml(profile.name || '')));
  const targetBits = [profile.title, profile.status].filter(Boolean).join(' · ');
  if (targetBits) header.appendChild(el('p', 'target', '求职意向：' + formatText(targetBits)));
  const meta = [profile.university, profile.location, profile.major, profile.graduation].filter(Boolean);
  if (meta.length) header.appendChild(el('p', 'meta', meta.map(formatText).join(' · ')));
  header.appendChild(renderContactList(profile, 'contacts'));
  return header;
}

function renderContactList(profile, className) {
  const list = el('ul', className);
  if (profile.phone) {
    const phone = String(profile.phone);
    list.appendChild(el('li', '', `${icon('phone')}<a href="tel:${escapeHtml(phone.replace(/\s+/g, ''))}">${escapeHtml(phone)}</a>`));
  }
  if (profile.email) {
    list.appendChild(el('li', '', `${icon('mail')}<a href="mailto:${escapeHtml(profile.email)}">${escapeHtml(profile.email)}</a>`));
  }
  const github = safeUrl(profile.github);
  if (github) {
    list.appendChild(el('li', '', `${icon('github')}<a href="${escapeHtml(github)}" target="_blank" rel="noopener noreferrer">${escapeHtml(shortUrl(github))}</a>`));
  }
  return list;
}

function renderPhoto(profile) {
  const figure = el('figure', 'photo');
  const src = safeUrl(profile.avatar);
  if (!src) {
    figure.hidden = true;
    return figure;
  }
  figure.innerHTML = `<img src="${escapeHtml(src)}" alt="${escapeHtml(profile.name || '照片')}">`;
  return figure;
}

function renderSideContact(profile) {
  const section = el('section', 'block side-contact');
  section.appendChild(el('h2', '', '联系方式'));
  const list = renderContactList(profile, 'side-list');
  section.appendChild(list);
  return section;
}

function renderSummary(profile) {
  const section = el('section', 'block');
  section.id = 'summary';
  section.appendChild(el('h2', '', '个人简介'));
  section.appendChild(el('p', 'summary', formatText(profile.summary || profile.bio || '')));
  return section;
}

function renderProjects(projects) {
  const section = el('section', 'block');
  section.id = 'projects';
  section.appendChild(el('h2', '', '项目经历'));
  projects.forEach((project) => {
    const article = el('article', 'project');
    const stack = (project.stack || []).map(escapeHtml).join(' · ');
    article.appendChild(el('div', 'row', `<h3>${escapeHtml(project.name || '')}</h3>${stack ? `<span class="stack">${stack}</span>` : ''}`));
    if (project.summary) article.appendChild(el('p', '', formatText(project.summary)));
    const url = safeUrl(project.url);
    if (url) {
      article.appendChild(el('p', '', `<a class="repo" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(shortUrl(url))}</a>`));
    }
    section.appendChild(article);
  });
  return section;
}

function renderExperience(items) {
  const section = el('section', 'block');
  section.id = 'experience';
  section.appendChild(el('h2', '', '实践经历'));
  items.forEach((item) => {
    const article = el('article', 'exp');
    article.appendChild(el('div', 'row', `<h3>${escapeHtml(item.title || '')}</h3><span class="date">${formatText(item.date || '')}</span>`));
    if (item.org) article.appendChild(el('p', 'org', escapeHtml(item.org)));
    if (item.description) article.appendChild(el('p', '', formatText(item.description)));
    const tags = item.tags || [];
    if (tags.length) article.appendChild(renderTags(tags));
    section.appendChild(article);
  });
  return section;
}

function renderEducation(items) {
  const section = el('section', 'block');
  section.id = 'education';
  section.appendChild(el('h2', '', '教育背景'));
  items.forEach((item) => {
    const article = el('article', 'edu');
    const bits = [item.detail || item.level, item.major, item.date].filter(Boolean);
    article.appendChild(el('div', 'row', `<h3>${escapeHtml(item.school || '')}</h3>`));
    if (bits.length) article.appendChild(el('p', '', bits.map(formatText).join(' · ')));
    if (item.note) article.appendChild(el('p', '', formatText(item.note)));
    section.appendChild(article);
  });
  return section;
}

function renderGame(game) {
  const line = el('p', 'game-link no-print');
  if (!game || !game.src) {
    line.hidden = true;
    return line;
  }
  const src = safeUrl(game.src);
  if (!src) {
    line.hidden = true;
    return line;
  }
  line.innerHTML = `小作品 <a href="${escapeHtml(src)}">${escapeHtml(game.title || '打开')}</a>`;
  return line;
}

function renderSkills(groups) {
  const section = el('section', 'block');
  section.id = 'skills';
  section.appendChild(el('h2', '', '技能'));
  groups.forEach((group) => {
    const wrap = el('div', 'skill-group');
    const tags = group.tags || [];
    wrap.appendChild(el('p', 'skill-name', escapeHtml(group.name || '')));
    if (tags.length) wrap.appendChild(renderTags(tags));
    section.appendChild(wrap);
  });
  return section;
}

function renderTags(tags) {
  const list = el('ul', 'tags');
  tags.forEach((tag) => list.appendChild(el('li', 'tag', escapeHtml(tag))));
  return list;
}

function renderCertificates(items) {
  const section = el('section', 'block');
  section.id = 'certs';
  section.appendChild(el('h2', '', '证书'));
  const list = el('div', 'certs');
  items.forEach((item) => {
    const parts = [item.title, item.issuer, item.year].filter(Boolean);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'cert-btn';
    button.innerHTML = formatText(parts.join(' · '));
    const src = safeUrl(item.img);
    if (src) {
      button.addEventListener('click', () => openViewer(src, item.title || '证书'));
    }
    list.appendChild(button);
  });
  section.appendChild(list);
  return section;
}

function renderHonors(honors) {
  const section = el('section', 'block');
  section.id = 'honors';
  section.appendChild(el('h2', '', '荣誉'));
  const list = el('ul', 'honors');
  honors.forEach((honor) => {
    const title = typeof honor === 'string' ? honor : honor.title;
    if (title) list.appendChild(el('li', '', escapeHtml(title)));
  });
  section.appendChild(list);
  return section;
}

function renderGallery(items) {
  const section = el('section', 'block no-print');
  if (!items.length) {
    section.hidden = true;
    return section;
  }
  section.appendChild(el('h2', '', '佐证图片'));
  const grid = el('div', 'gallery');
  items.forEach((item) => {
    const src = safeUrl(item.img);
    if (!src) return;
    const figure = document.createElement('figure');
    figure.innerHTML = `<button type="button"><img src="${escapeHtml(src)}" alt="${escapeHtml(item.title || '佐证图片')}"></button>`;
    figure.querySelector('button').addEventListener('click', () => openViewer(src, item.title || '佐证图片'));
    grid.appendChild(figure);
  });
  section.appendChild(grid);
  return section;
}

function renderFooter(footer) {
  return el('footer', 'footer', escapeHtml(footer.copyright || ''));
}

function openViewer(src, title) {
  const viewer = document.getElementById('viewer');
  const image = document.getElementById('viewerImg');
  image.src = src;
  image.alt = title || '图片';
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('viewerClose').focus();
}

function closeViewer() {
  const viewer = document.getElementById('viewer');
  const image = document.getElementById('viewerImg');
  viewer.classList.remove('open');
  image.src = '';
  document.body.style.overflow = '';
}

document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.getElementById('viewer').addEventListener('click', (event) => {
  if (event.target.id === 'viewer') closeViewer();
});
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeViewer();
});

init();
</script>
</body>
</html>
