<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('showcase-theme') || 'light'; }
catch (e) { document.documentElement.dataset.theme = 'light'; }
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduce');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f5f7">
<title>陈芷锐</title>
<meta name="description" content="陈芷锐">
<link rel="icon" href="assets/avatar.jpg">
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --blue: #0071e3;
  --line: rgba(0, 0, 0, 0.08);
  --nav: rgba(255, 255, 255, 0.72);
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
  --feature: #000000;
  --feature-text: #f5f5f7;
  --feature-muted: #a1a1a6;
  --chip: #e8e8ed;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #000000;
  --card: #1d1d1f;
  --text: #f5f5f7;
  --muted: #a1a1a6;
  --blue: #2997ff;
  --line: rgba(255, 255, 255, 0.12);
  --nav: rgba(0, 0, 0, 0.72);
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --feature: #f5f5f7;
  --feature-text: #1d1d1f;
  --feature-muted: #6e6e73;
  --chip: #2c2c2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 17px;
  line-height: 1.47;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); }
button { font-family: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

.nav {
  position: sticky;
  top: 0;
  z-index: 40;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 22px;
  background: var(--nav);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.brand { color: var(--text); text-decoration: none; font-weight: 600; letter-spacing: -0.01em; flex: 0 0 auto; }
.nav-links { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav-links::-webkit-scrollbar { display: none; }
.nav-links a { color: var(--muted); text-decoration: none; padding: 6px 8px; white-space: nowrap; }
.nav-links a.active { color: var(--text); }
.theme-btn {
  border: 0;
  background: transparent;
  color: var(--blue);
  font-size: 12px;
  cursor: pointer;
  padding: 6px 0 6px 8px;
  flex: 0 0 auto;
}

.hero-pin { height: 150vh; }
.hero-sticky {
  position: sticky;
  top: 48px;
  height: calc(100svh - 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 22px 48px;
  overflow: hidden;
}
.hero-lockup { transform-origin: center center; will-change: transform, opacity; }
.eyebrow, .kicker { margin: 0 0 8px; color: var(--muted); font-size: 17px; font-weight: 600; }
h1, .display {
  margin: 0;
  font-size: clamp(48px, 8vw, 96px);
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.hero-title { margin: 10px 0 0; font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.02em; }
.tagline { margin: 14px 0 0; font-size: clamp(21px, 2.4vw, 28px); font-weight: 600; letter-spacing: -0.02em; }
.summary { max-width: 640px; margin: 18px auto 0; color: var(--muted); font-size: 17px; }
.summary p { margin: 0 0 6px; }
.meta { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
.contacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 18px; margin: 16px 0 0; padding: 0; list-style: none; font-size: 17px; }
.contacts a { text-decoration: none; }
.contacts a:hover { text-decoration: underline; }
.avatar-btn {
  margin-top: 28px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 28px;
}
.avatar-btn img {
  width: min(280px, 68vw);
  height: min(280px, 68vw);
  object-fit: cover;
  border-radius: 28px;
  display: block;
  box-shadow: var(--shadow);
  will-change: transform;
}
.egg-hint { margin: 10px 0 0; color: var(--muted); font-size: 12px; }

.feature { height: 230vh; background: var(--feature); color: var(--feature-text); }
.feature-sticky { position: sticky; top: 48px; height: calc(100svh - 48px); }
.feature-slide {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 32px 20px;
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.feature-slide.on { opacity: 1; transform: none; }
.feature-num {
  margin: 8px 0;
  font-size: clamp(72px, 14vw, 160px);
  font-weight: 600;
  letter-spacing: -0.045em;
  line-height: 0.92;
}
.feature-label { margin: 0; font-size: clamp(21px, 3vw, 32px); font-weight: 600; letter-spacing: -0.02em; }
.feature .kicker { color: var(--feature-muted); }

.band { padding: 100px 0 40px; }
.band.alt { background: var(--card); }
.wrap { width: min(980px, calc(100% - 40px)); margin: 0 auto; }
.band h2 { margin: 0 0 28px; }
.h-scroll { position: relative; }
.h-sticky { position: sticky; top: 48px; height: calc(100svh - 48px); overflow: hidden; display: flex; align-items: center; }
.h-track { display: flex; gap: 24px; padding: 0 7vw; will-change: transform; }
.product {
  flex: 0 0 min(760px, 78vw);
  min-height: 460px;
  background: var(--card);
  color: var(--text);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 56px 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.product h3 { margin: 0; font-size: clamp(36px, 4.6vw, 56px); font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; overflow-wrap: anywhere; }
.product .tag { margin: 14px 0 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 0; padding: 0; list-style: none; }
.chips li { background: var(--chip); color: var(--text); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.links { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 28px; font-size: 17px; }
.links a { text-decoration: none; }
.links a:hover { text-decoration: underline; }

.detail { width: min(692px, calc(100% - 40px)); margin: 0 auto 72px; }
.detail h3 { margin: 0 0 8px; font-size: clamp(32px, 4vw, 48px); font-weight: 600; letter-spacing: -0.03em; }
.detail p { margin: 0; color: var(--muted); font-size: 17px; }

.rows { width: min(860px, calc(100% - 40px)); margin: 0 auto; }
.row-item { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 28px 0; border-top: 1px solid var(--line); }
.row-item h3 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
.row-item p { margin: 6px 0 0; color: var(--muted); }
.row-item time { color: var(--muted); font-size: 17px; white-space: nowrap; }
.award { color: var(--text) !important; font-weight: 600; }

.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 40px; width: min(860px, calc(100% - 40px)); margin: 0 auto; }
.skills h3 { margin: 0 0 8px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }

.certs { width: min(980px, calc(100% - 40px)); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cert {
  padding: 0;
  border: 0;
  background: var(--card);
  color: inherit;
  text-align: left;
  border-radius: 28px;
  box-shadow: var(--shadow);
  overflow: hidden;
  cursor: pointer;
}
.cert-media { height: 220px; overflow: hidden; background: #eee; }
.cert img { width: 100%; height: 100%; object-fit: cover; display: block; will-change: transform; }
.cert div:last-child { padding: 18px 22px 22px; }
.cert h3 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.cert p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.honors { width: min(860px, calc(100% - 40px)); margin: 0 auto; display: flex; flex-wrap: wrap; gap: 10px 12px; padding: 0; list-style: none; }
.honors li { background: var(--card); border-radius: 999px; padding: 10px 16px; box-shadow: var(--shadow); font-size: 15px; }
.gallery { width: min(980px, calc(100% - 40px)); margin: 12px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.gallery button { padding: 0; border: 0; border-radius: 28px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); background: var(--card); }
.gallery img { width: 100%; height: 320px; object-fit: cover; display: block; }
.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 28px 20px 48px; }
.footer a { text-decoration: none; margin-left: 16px; }
.line { opacity: 0; transform: translateY(22px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.line.in { opacity: 1; transform: none; }
.line.d1 { transition-delay: .08s; }
.line.d2 { transition-delay: .16s; }
.line.d3 { transition-delay: .24s; }
.line.d4 { transition-delay: .32s; }

.viewer { position: fixed; inset: 0; z-index: 60; display: none; background: rgba(0, 0, 0, 0.72); align-items: center; justify-content: center; padding: 24px; }
.viewer.open { display: flex; }
.viewer img { max-width: min(1000px, 100%); max-height: calc(100vh - 100px); background: #fff; border-radius: 12px; }
.viewer-close { position: absolute; top: 16px; right: 16px; border: 0; border-radius: 999px; background: #fff; color: #1d1d1f; padding: 8px 14px; cursor: pointer; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px); background: #1d1d1f; color: #f5f5f7; border-radius: 999px; padding: 8px 14px; font-size: 14px; opacity: 0; z-index: 70; transition: .3s var(--ease); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 800px) {
  .nav { padding: 0 12px; gap: 8px; }
  .nav-links { min-width: 0; }
  .nav-links a { padding: 6px 4px; font-size: 11px; }
  .hero-pin, .feature, .h-scroll { height: auto; }
  .hero-sticky, .feature-sticky, .h-sticky { position: static; height: auto; overflow: visible; }
  .feature-sticky { display: block; }
  .feature-slide { position: relative; opacity: 1; transform: none; min-height: 70vh; }
  .h-sticky { overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding: 8px 0 28px; }
  .h-track { transform: none !important; padding: 0 20px 8px; }
  .product { flex-basis: 86vw; scroll-snap-align: center; min-height: 380px; padding: 36px 28px; }
  .skills, .certs, .gallery { grid-template-columns: 1fr; }
  .gallery img, .cert-media { height: 200px; }
  .row-item { grid-template-columns: 1fr; gap: 6px; }
  .band { padding: 72px 0 16px; }
}
html.reduce .line { opacity: 1; transform: none; transition: none; }
html.reduce .hero-pin,
html.reduce .feature,
html.reduce .h-scroll { height: auto; }
html.reduce .hero-sticky,
html.reduce .feature-sticky,
html.reduce .h-sticky { position: static; height: auto; overflow: visible; }
html.reduce .feature-slide { position: relative; opacity: 1; transform: none; min-height: 0; padding: 48px 20px; }
html.reduce .h-track { transform: none !important; flex-wrap: wrap; }
html.reduce .product { flex: 1 1 100%; }
html.reduce .hero-lockup,
html.reduce .avatar-btn img,
html.reduce [data-zoom] { transform: none !important; }

@media print {
  .nav, .egg-hint, .no-print, #confetti, .toast, .viewer, .h-scroll { display: none !important; }
  html, body { background: #fff !important; color: #1d1d1f !important; }
  .hero-pin, .feature, .h-scroll { height: auto !important; }
  .hero-sticky, .feature-sticky { position: static !important; height: auto !important; }
  .feature { background: #fff !important; color: #1d1d1f !important; }
  .feature-slide { position: static !important; opacity: 1 !important; transform: none !important; color: #1d1d1f !important; min-height: 0; padding: 8px 0; }
  .feature-num { font-size: 32px; color: #1d1d1f; }
  .line { opacity: 1 !important; transform: none !important; }
  .avatar-btn img { width: 28mm; height: 28mm; box-shadow: none; }
  .product, .cert, .honors li, .chips li { box-shadow: none; background: #fff; }
  .chips li { display: inline; background: none; padding: 0; }
  .chips li:not(:last-child)::after { content: "、"; }
  a { color: #1d1d1f; text-decoration: none; }
  .band { padding: 16px 0; }
  .row-item, .detail, .cert { break-inside: avoid; }
  @page { size: A4; margin: 12mm; }
}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="#top" id="brand">陈芷锐</a>
  <nav class="nav-links" id="navLinks" aria-label="页面目录">
    <a href="#highlights">数字</a>
    <a href="#projects">项目</a>
    <a href="#experience">经历</a>
    <a href="#education">教育</a>
    <a href="#skills">技能</a>
    <a href="#certs">证书</a>
    <a href="#honors">荣誉</a>
  </nav>
  <button class="theme-btn" id="themeBtn" type="button">深色</button>
</header>
<main id="app"></main>
<div class="viewer no-print" id="viewer" role="dialog" aria-modal="true" aria-label="图片预览">
  <button class="viewer-close" id="viewerClose" type="button">关闭</button>
  <img id="viewerImg" alt="">
</div>
<canvas id="confetti" class="no-print" aria-hidden="true"></canvas>
<div class="toast no-print" id="toast" role="status"></div>
<script>
const reduce = document.documentElement.classList.contains('reduce');
const narrowQuery = matchMedia('(max-width: 800px)');
let narrow = narrowQuery.matches;

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function safeUrl(url) {
  const value = String(url ?? '').trim();
  if (/^(https?:\/\/|mailto:|tel:)/i.test(value)) return value;
  if (/^(assets\/|tank-battle\.html)[\w./-]*$/.test(value)) return value;
  return '';
}
function el(tag, className, html) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (html !== undefined) node.innerHTML = html;
  return node;
}
function certItems(certificates) {
  if (Array.isArray(certificates)) return certificates;
  return (certificates && (certificates.items || certificates.cards)) || [];
}
function sentences(text) {
  return String(text || '').split('。').map((part) => part.trim()).filter(Boolean).map((part) => `${part}。`);
}
function countWord(n) {
  const digits = ['零', '一', '两', '三', '四', '五', '六', '七', '八', '九', '十'];
  return n <= 10 ? digits[n] : String(n);
}
function taglineOf(summary) {
  const text = String(summary || '');
  const words = text.match(/(\d{3,})\s*词/);
  if (words) return `${words[1]} 个词，离线也能背。`;
  const first = text.split('。')[0] || text;
  const cut = first.split('，')[0];
  return `${cut || first}。`;
}
function progressOf(section) {
  const start = section.offsetTop;
  const end = start + section.offsetHeight - window.innerHeight;
  if (end <= start) return 0;
  return Math.min(1, Math.max(0, (window.scrollY - start) / (end - start)));
}

async function init() {
  const app = document.getElementById('app');
  let config;
  try {
    const response = await fetch('config.json');
    if (!response.ok) throw new Error(String(response.status));
    config = await response.json();
  } catch (error) {
    app.appendChild(el('p', 'summary', '内容加载失败，请确认 config.json 可以访问。'));
    return;
  }
  document.title = config.site?.title || config.profile?.name || '陈芷锐';
  const description = document.querySelector('meta[name="description"]');
  if (description && config.site?.description) description.setAttribute('content', config.site.description);
  if (config.profile?.name) document.getElementById('brand').textContent = config.profile.name;

  app.appendChild(renderHero(config));
  app.appendChild(renderFeature(config));
  app.appendChild(renderProjects(config.projects || []));
  app.appendChild(renderExperience(config.experience || []));
  app.appendChild(renderEducation(config.education || []));
  app.appendChild(renderSkills(config.skillGroups || []));
  app.appendChild(renderCertificates(certItems(config.certificates)));
  app.appendChild(renderHonors(config.honors || []));
  app.appendChild(renderGallery((config.certificates && config.certificates.gallery) || []));
  app.appendChild(renderFooter(config));

  setupReveal();
  setupScroll();
  setupNav();
  document.getElementById('avatarBtn')?.addEventListener('click', (event) => {
    burst(event.clientX, event.clientY);
    toast('彩蛋');
  });
  document.getElementById('themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '浅色' : '深色';
}

function renderHero(config) {
  const profile = config.profile || {};
  const projects = config.projects || [];
  const section = el('section', 'hero-pin');
  section.id = 'top';
  const photo = safeUrl(profile.avatar);
  const lines = sentences(profile.summary).map((line, index) => `<p class="line d${Math.min(index + 1, 4)}">${escapeHtml(line)}</p>`).join('');
  const meta = [profile.major, profile.graduation, profile.location, profile.status].filter(Boolean).map(escapeHtml).join(' · ');
  section.innerHTML = `
    <div class="hero-sticky">
      <div class="hero-lockup" id="heroLockup">
        <p class="eyebrow">${escapeHtml(profile.university || '')}</p>
        <h1>${escapeHtml(profile.name || '')}</h1>
        <p class="hero-title">${escapeHtml(profile.title || '')}</p>
        <p class="tagline">一个人，${countWord(projects.length)}个项目。</p>
        <div class="summary">${lines}</div>
        <p class="meta">${meta}</p>
        ${contactHtml(profile)}
      </div>
      ${photo ? `<button class="avatar-btn" id="avatarBtn" type="button" aria-label="照片彩蛋"><img data-zoom src="${escapeHtml(photo)}" alt="${escapeHtml(profile.name || '')}"></button><p class="egg-hint no-print">轻点照片</p>` : ''}
    </div>`;
  return section;
}

function contactHtml(profile) {
  const bits = [];
  if (profile.phone) bits.push(`<li><a href="tel:${escapeHtml(String(profile.phone).replace(/\s+/g, ''))}">${escapeHtml(profile.phone)}</a></li>`);
  if (profile.email) bits.push(`<li><a href="mailto:${escapeHtml(profile.email)}">${escapeHtml(profile.email)}</a></li>`);
  const github = safeUrl(profile.github);
  if (github) bits.push(`<li><a href="${escapeHtml(github)}" target="_blank" rel="noopener noreferrer">GitHub</a></li>`);
  return `<ul class="contacts">${bits.join('')}</ul>`;
}

function renderFeature(config) {
  const section = el('section', 'feature');
  section.id = 'highlights';
  const slides = [];
  (config.projects || []).forEach((project) => {
    const match = String(project.summary || '').match(/(\d{3,})/);
    if (match && slides.every((slide) => slide.count !== Number(match[1]))) {
      slides.push({ kicker: project.name, num: match[1], label: '离线词库里的词。', count: Number(match[1]) });
    }
  });
  const prize = (config.experience || []).find((item) => String(item.description || '').includes('一等奖'));
  if (prize) slides.push({ kicker: '北京赛区', num: '一等', label: `${prize.title}。`, count: 0 });
  const honors = config.honors || [];
  if (honors.length) slides.push({ kicker: '荣誉', num: String(honors.length), label: '项荣誉。', count: honors.length });
  const sticky = el('div', 'feature-sticky');
  slides.forEach((slide, index) => {
    const node = el('div', `feature-slide${index === 0 ? ' on' : ''}`);
    node.innerHTML = `<p class="kicker">${escapeHtml(slide.kicker)}</p><p class="feature-num" ${slide.count ? `data-count="${slide.count}"` : ''}>${escapeHtml(slide.num)}</p><p class="feature-label">${escapeHtml(slide.label)}</p>`;
    sticky.appendChild(node);
  });
  section.appendChild(sticky);
  return section;
}

function renderProjects(projects) {
  const section = el('section', '');
  section.id = 'projects';
  const head = el('div', 'band');
  head.innerHTML = `<div class="wrap"><h2 class="display line">${countWord(projects.length)}个项目。</h2></div>`;
  section.appendChild(head);
  const scroller = el('div', 'h-scroll');
  scroller.id = 'gallery';
  const sticky = el('div', 'h-sticky');
  const track = el('div', 'h-track');
  projects.forEach((project, index) => {
    const url = safeUrl(project.url);
    const card = el('article', 'product');
    card.id = `tile-${index}`;
    card.innerHTML = `
      <h3>${escapeHtml(project.name || '')}</h3>
      <p class="tag">${escapeHtml(taglineOf(project.summary))}</p>
      <ul class="chips">${(project.stack || []).map((item) => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
      <div class="links">
        <a href="#detail-${index}">进一步了解 &gt;</a>
        ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">GitHub &gt;</a>` : ''}
      </div>`;
    track.appendChild(card);
  });
  sticky.appendChild(track);
  scroller.appendChild(sticky);
  section.appendChild(scroller);
  const details = el('div', 'band');
  projects.forEach((project, index) => {

    details.appendChild(block);
  });
  section.appendChild(details);
  return section;
}

function setupReveal() {
  const nodes = [...document.querySelectorAll('.line')];
  if (reduce) {
    nodes.forEach((node) => node.classList.add('in'));
    return;
  }
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;
      entry.target.classList.add('in');
      observer.unobserve(entry.target);
    });
  }, { threshold: 0.2 });
  nodes.forEach((node) => observer.observe(node));
}

function setupScroll() {
  const hero = document.getElementById('top');
  const lockup = document.getElementById('heroLockup');
  const feature = document.getElementById('highlights');
  const slides = [...document.querySelectorAll('.feature-slide')];
  const gallery = document.getElementById('gallery');
  const track = gallery?.querySelector('.h-track');
  const counted = new WeakSet();

  const runCount = (node) => {
    if (!node || counted.has(node)) return;
    counted.add(node);
    const target = Number(node.dataset.count || 0);
    if (!target || reduce) {
      node.textContent = String(target || node.textContent);
      return;
    }
    const start = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - start) / 900);
      const eased = 1 - Math.pow(1 - t, 3);
      node.textContent = String(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  const sizeGallery = () => {
    if (!gallery || !track) return;
    if (reduce || narrow) {
      gallery.style.height = 'auto';
      track.style.transform = '';
      return;
    }
    const max = Math.max(0, track.scrollWidth - gallery.querySelector('.h-sticky').clientWidth);
    gallery.style.height = `${window.innerHeight + max}px`;
  };

  const update = () => {
    if (lockup && hero && !reduce && !narrow) {
      const p = progressOf(hero);
      lockup.style.transform = `scale(${(1 - p * 0.16).toFixed(4)})`;
      lockup.style.opacity = String(1 - p * 0.25);
      const photo = document.querySelector('.avatar-btn img');
      if (photo) photo.style.transform = `scale(${(1 + p * 0.06).toFixed(4)})`;
    }
    if (feature && slides.length && !reduce && !narrow) {
      const p = progressOf(feature);
      const index = Math.min(slides.length - 1, Math.floor(p * slides.length));
      slides.forEach((slide, i) => {
        const on = i === index;
        slide.classList.toggle('on', on);
        slide.toggleAttribute('aria-hidden', !on);
        if (on && p > 0.02) runCount(slide.querySelector('[data-count]'));
      });
    } else {
      slides.forEach((slide) => runCount(slide.querySelector('[data-count]')));
    }
    if (gallery && track && !reduce && !narrow) {
      const max = Math.max(0, track.scrollWidth - gallery.querySelector('.h-sticky').clientWidth);
      track.style.transform = `translate3d(${(-progressOf(gallery) * max).toFixed(2)}px,0,0)`;
    }
    if (!reduce && !narrow) {
      document.querySelectorAll('[data-zoom]').forEach((image) => {
        if (image.closest('.avatar-btn')) return;
        const rect = image.getBoundingClientRect();
        const center = (rect.top + rect.height / 2) / window.innerHeight;
        const scale = 1.04 - Math.min(Math.abs(center - 0.45), 0.5) * 0.06;
        image.style.transform = `scale(${scale.toFixed(4)})`;
      });
    }
  };

  sizeGallery();
  update();
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { update(); ticking = false; });
  }, { passive: true });
  window.addEventListener('resize', () => { narrow = narrowQuery.matches; sizeGallery(); update(); });
  narrowQuery.addEventListener('change', () => { narrow = narrowQuery.matches; sizeGallery(); update(); });
}

function setupNav() {
  const links = [...document.querySelectorAll('.nav-links a')];
  const spy = new IntersectionObserver((entries) => {
    const visible = entries.filter((entry) => entry.isIntersecting).sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
    if (!visible) return;
    links.forEach((link) => link.classList.toggle('active', link.getAttribute('href') === `#${visible.target.id}`));
  }, { threshold: 0.35, rootMargin: '-20% 0px -45% 0px' });
  document.querySelectorAll('main section[id], #gallery').forEach((section) => {
    if (section.id && section.id !== 'gallery') spy.observe(section);
  });
}

function openViewer(src, title) {
  const image = document.getElementById('viewerImg');
  image.src = src;
  image.alt = title || '图片';
  document.getElementById('viewer').classList.add('open');
}
function closeViewer() {
  document.getElementById('viewer').classList.remove('open');
  document.getElementById('viewerImg').src = '';
}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
document.getElementById('viewer').addEventListener('click', (event) => { if (event.target.id === 'viewer') closeViewer(); });
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.getElementById('themeBtn').textContent = next === 'dark' ? '浅色' : '深色';
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', next === 'dark' ? '#000000' : '#f5f5f7');
  try { localStorage.setItem('showcase-theme', next); } catch (e) {}
});

const confetti = document.getElementById('confetti');
const confettiCtx = confetti.getContext('2d');
let bits = [];
function resizeConfetti() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  confetti.width = Math.floor(window.innerWidth * dpr);
  confetti.height = Math.floor(window.innerHeight * dpr);
  confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resizeConfetti();
window.addEventListener('resize', resizeConfetti);
function burst(x, y) {
  if (reduce) return;
  const colors = ['#0071e3', '#1d1d1f', '#f5f5f7', '#6e6e73', '#ff4d4f'];
  for (let i = 0; i < 80; i += 1) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    bits.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2, g: 0.12, life: 60, color: colors[i % colors.length], w: 5, h: 8 });
  }
  if (burst.running) return;
  burst.running = true;
  const step = () => {
    confettiCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    bits = bits.filter((bit) => bit.life > 0);
    bits.forEach((bit) => {
      bit.vy += bit.g;
      bit.x += bit.vx;
      bit.y += bit.vy;
      bit.life -= 1;
      confettiCtx.globalAlpha = Math.max(0, bit.life / 60);
      confettiCtx.fillStyle = bit.color;
      confettiCtx.fillRect(bit.x, bit.y, bit.w, bit.h);
    });
    if (bits.length) requestAnimationFrame(step);
    else burst.running = false;
  };
  requestAnimationFrame(step);
}
function toast(message) {
  const node = document.getElementById('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove('show'), 1400);
}
const konami = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a'];
let konamiAt = 0;
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeViewer();
  const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
  konamiAt = key === konami[konamiAt] ? konamiAt + 1 : (key === konami[0] ? 1 : 0);
  if (konamiAt !== konami.length) return;
  konamiAt = 0;
  burst(window.innerWidth / 2, window.innerHeight / 3);
  toast('进入坦克大战');
  setTimeout(() => { window.location.href = 'tank-battle.html'; }, reduce ? 0 : 600);
});

init();
</script>
