<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陈芷锐</title>
<meta name="description" content="陈芷锐 · AI 训练师 · 喜欢健身">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;
  --paper:#ffffff;
  --ink:#1d1d1f;
  --muted:#5e5e64;
  --faint:#6e6e73;
  --line:#d2d2d7;
  --accent:#234237;
  --shadow:0 18px 50px rgba(29,29,31,.08);
  --serif:"Noto Serif SC","Songti SC",serif;
  --sans:"Inter","PingFang SC","Noto Sans SC",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --pad:clamp(20px,4vw,40px);
  --max:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,a{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:16px;top:12px;transform:translateY(-140%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:999px;z-index:50}
.skip:focus{transform:none}
.wrap{width:min(var(--max),calc(100% - var(--pad)*2));margin:0 auto}
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 var(--pad);background:rgba(245,245,247,.82);backdrop-filter:saturate(140%) blur(18px);border-bottom:1px solid transparent}
.nav.scrolled{background:rgba(255,255,255,.9);border-bottom-color:var(--line)}
.word{font-family:var(--serif);font-weight:600;text-decoration:none;letter-spacing:-.03em}
.nav-links{display:flex;gap:28px}
.nav-links a{text-decoration:none;font-size:14px;color:var(--muted)}
.nav-links a[aria-current="true"]{color:var(--ink)}
.menu-btn{display:none;min-width:44px;min-height:44px;border:0;background:transparent;border-radius:10px}
.menu{display:none}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:28px 0 72px}
.role{margin:0;color:var(--muted);font-size:14px;letter-spacing:.08em}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(4.4rem,11vw,8.4rem);line-height:.92;letter-spacing:-.045em;margin:10px 0 18px}
.lede{max-width:28rem;font-size:clamp(1.15rem,2vw,1.45rem);line-height:1.45;margin:0 0 28px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;border:0;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:hover{transform:translateY(-2px)}
.portrait{margin:0;border-radius:28px;overflow:hidden;background:#e7e7ea;aspect-ratio:4/5;box-shadow:var(--shadow)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
section{padding:88px 0}
.kicker{margin:0 0 14px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.15;letter-spacing:-.03em;margin:0 0 18px}
.prose{max-width:42rem;color:#2a2a2d;font-size:1.05rem}
.schools{list-style:none;margin:48px 0 0;padding:0;border-top:1px solid var(--line)}
.schools li{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.schools strong{font-weight:600}
.schools p{margin:4px 0 0;color:var(--muted)}
.work-feature{display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:end;background:var(--paper);border-radius:28px;padding:clamp(24px,4vw,48px);box-shadow:var(--shadow)}
.work-feature .btn{margin-top:22px}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.facts li{font-family:var(--serif);font-size:clamp(1.4rem,2.4vw,2rem);letter-spacing:-.03em;border-top:1px solid var(--line);padding-top:12px}
.work-feature h3{font-family:var(--serif);font-size:clamp(2rem,4vw,3.2rem);font-weight:500;letter-spacing:-.03em;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.tags span{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.skills{margin:56px 0 0}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 200px;grid-template-areas:"name meter" "level meter" "desc meter";gap:2px 24px;padding:18px 0;border-top:1px solid var(--line)}
.skill b{grid-area:name;font-weight:600}
.skill em{grid-area:level;font-style:normal;color:var(--faint);font-family:var(--mono);font-size:12px}
.skill p{grid-area:desc;margin:4px 0 0;color:var(--muted);font-size:14px}
.meter{grid-area:meter;align-self:center;height:2px;background:#e3e3e6;border-radius:2px}
.meter span{display:block;height:100%;width:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.22,1,.36,1)}
.meter.in span{transform:scaleX(var(--p))}
.docs{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin:48px 0 8px}
.doc{margin:0;background:var(--paper);border-radius:22px;overflow:hidden;border:1px solid var(--line);cursor:pointer;padding:0;text-align:left;color:inherit}
.doc img{width:100%;height:340px;object-fit:contain;background:#f3f1ec}
.doc figcaption{padding:14px 16px 16px;font-size:14px}
.certs{margin-top:8px}
.cert{width:100%;display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:center;padding:16px 0;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;color:inherit}
.cert img{width:92px;height:68px;object-fit:contain;border-radius:8px;background:#f3f1ec}
.cert small{color:var(--muted)}
.cert code{font-family:var(--mono);font-size:12px;color:var(--faint)}
.life-head{max-width:36rem}
.life-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:28px;align-items:start}
.life-side{display:grid;gap:16px}
.shot{margin:0;border-radius:22px;overflow:hidden;background:#ececee}
.shot img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center}
.life-side .shot:last-child img{aspect-ratio:1/1;object-position:center 78%}
.shot{transition:transform .5s cubic-bezier(.22,1,.36,1)}
.shot:hover{transform:translateY(-6px)}
.path{list-style:none;margin:8px 0 0;padding:0}
.path li{display:grid;grid-template-columns:120px 1fr;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
.path time{color:var(--faint);font-family:var(--mono);font-size:13px}
.path h3{margin:0 0 4px;font-size:1.25rem}
.path .org{margin:0 0 8px;color:var(--muted);font-size:14px}
.path p{margin:0;max-width:40rem}
.honors{margin:28px 0 0;color:var(--muted);max-width:40rem}
.evidence{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.evidence .doc img{height:280px}
.contact-links{display:grid;gap:12px;margin-top:28px}
.contact-links a{display:flex;justify-content:space-between;align-items:center;gap:16px;text-decoration:none;background:var(--paper);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.contact-links a:hover{transform:translateY(-3px)}
.contact-links small{color:var(--faint)}
.contact-links strong{font-family:var(--serif);font-size:clamp(1.4rem,3vw,2rem);font-weight:500}
footer{padding:28px 0 48px;color:var(--faint);font-size:13px;border-top:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(20,20,22,.46);display:none;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal.open{display:flex}
.sheet{width:min(1100px,100%);height:min(86vh,860px);background:var(--paper);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet iframe,.sheet img{width:100%;height:100%;border:0;object-fit:contain;background:#111;flex:1}
.icon-btn{min-width:44px;min-height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer}
.js .reveal{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .9s cubic-bezier(.22,1,.36,1)}
.js .reveal.in{opacity:1;transform:none}
.js .portrait{transition-delay:.12s}
.js .portrait img{transform:scale(1.05);transition:transform 1.3s cubic-bezier(.22,1,.36,1)}
.js .portrait.in img{transform:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:860px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex;align-items:center;justify-content:center}
  .menu{position:absolute;left:0;right:0;top:64px;background:#fff;border-bottom:1px solid var(--line);padding:6px var(--pad) 14px}
  .menu.open{display:grid}
  .menu a{padding:14px 0;text-decoration:none;border-top:1px solid var(--line)}
  .hero,.docs,.life-grid,.schools li,.path li,.skill,.evidence,.work-feature{grid-template-columns:1fr}
  .hero{padding-top:12px}
  .portrait{max-width:460px}
  .skill{grid-template-areas:"name" "level" "desc" "meter"}
  .meter{height:3px;margin-top:10px}
  .doc img{height:220px}
  .contact-links a{align-items:flex-start;flex-direction:column}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .reveal,.js .portrait img,.btn,.contact-links a,.meter span,.shot{transition:none;transform:none;opacity:1}
  .meter span{transform:scaleX(var(--p))}
  .btn:hover,.contact-links a:hover,.shot:hover{transform:none}
}
@media print{
  .nav,.menu-btn,.modal,.toast,.actions{display:none!important}
  .js .reveal{opacity:1!important;transform:none!important}
  body{background:#fff}
}
</style>
</head>
<body>
<a class="skip" href="#about">跳到内容</a>
<header class="nav" id="nav">
  <a class="word" href="#top">陈芷锐</a>
  <nav class="nav-links" aria-label="页面导航">
    <a href="#about">关于</a>
    <a href="#work">作品</a>
    <a href="#life">生活</a>
    <a href="#experience">经历</a>
    <a href="#contact">联系</a>
  </nav>
  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="菜单">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <div class="menu" id="menu">
    <a href="#about">关于</a>
    <a href="#work">作品</a>
    <a href="#life">生活</a>
    <a href="#experience">经历</a>
    <a href="#contact">联系</a>
  </div>
</header>
<div id="top"></div>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <header>
      <strong id="modalTitle">查看</strong>
      <button class="icon-btn" type="button" id="modalClose" aria-label="关闭">关闭</button>
    </header>
    <iframe id="modalFrame" title="作品" hidden></iframe>
    <img id="modalImg" alt="" hidden>
  </div>
</div>
<script>
document.documentElement.classList.add('js');
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(tag, cls){ const n=document.createElement(tag); if(cls) n.className=cls; return n; }
function thumb(src){
  if(!src) return '';
  const base = src.split('/').pop().replace(/\.(png|jpe?g|webp)$/i,'');
  return `assets/thumbs/${base}.jpg`;
}

async function init(){
  const res = await fetch('config.json');
  const cfg = await res.json();
  document.title = cfg.site.title || cfg.profile.name;
  const meta = document.querySelector('meta[name="description"]');
  if(meta && cfg.site.description) meta.content = cfg.site.description;
  applyTheme(cfg.theme);
  render(cfg);
  bind(cfg);
}

function applyTheme(t){
  if(!t) return;
  const map = {bg:'--bg',surface:'--paper',text:'--ink',textDim:'--muted',border:'--line',accent:'--accent'};
  for(const [k,v] of Object.entries(map)){
    if(t[k]) document.documentElement.style.setProperty(v, t[k]);
  }
}

function render(cfg){
  const app = $('#app');
  app.append(hero(cfg), about(cfg), work(cfg), life(cfg), experience(cfg), contact(cfg), footer(cfg));
  observe();
}

function hero(cfg){
  const p = cfg.profile;
  const s = el('section','hero wrap');
  s.innerHTML = `
    <div class="reveal">
      <p class="role">${esc(cfg.about.card.role || p.title)}</p>
      <h1>${esc(p.name)}</h1>
      <p class="lede">专注于 AI 模型训练与智能体开发。<br>喜欢健身。</p>
      <div class="actions">
        <a class="btn" href="#work">看作品</a>
        <a class="btn ghost" href="#contact">联系</a>
      </div>
    </div>
    <figure class="portrait reveal">
      <img src="${esc(p.avatar)}" alt="${esc(p.name)}">
    </figure>`;
  return s;
}

function about(cfg){
  const s = el('section','wrap');
  s.id = 'about';
  const schools = cfg.education.map(item => {
    const bits = [item.level, item.pill && item.pill.label].filter(Boolean);
    let score = '';
    if(item.score){
      score = (item.scoreLabel || '{score}').replace('{score}', item.score);
    }
    const tags = (item.tags||[]).join(' · ');
    return `<li><div><strong>${esc(item.school)}</strong></div><div><p>${esc(bits.join(' · '))}</p>${score?`<p>${esc(score)}</p>`:''}${tags?`<p>${esc(tags)}</p>`:''}</div></li>`;
  }).join('');
  s.innerHTML = `
    <h2 class="reveal">${esc(cfg.about.heading)}<br>${esc(cfg.about.headingHighlight)}，${esc(cfg.about.headingSuffix)}</h2>
    <p class="prose reveal">${esc(cfg.about.description)}</p>
    <ul class="schools reveal">${schools}</ul>`;
  return s;
}

function work(cfg){
  const s = el('section','wrap');
  s.id = 'work';
  const g = cfg.game;
  const skills = cfg.skills.map(sk => `
    <div class="skill">
      <b>${esc(sk.name)}</b>
      <em>${esc(sk.level)}</em>
      <p>${esc(sk.desc)}</p>
      <div class="meter" style="--p:${Number(sk.width)||0}%"><span></span></div>
    </div>`).join('');
  const docs = (cfg.certificates.cards||[]).slice(0,2).map(item => `
    <button class="doc" type="button" data-img="${esc(item.img)}" data-title="${esc(item.title)}">
      <img src="${esc(thumb(item.img))}" alt="${esc(item.title)}">
      <figcaption>${esc(item.title)}${item.issuer?`<br><small>${esc(item.issuer)}</small>`:''}</figcaption>
    </button>`).join('');
  const certs = (cfg.certificates.cards||[]).map(c => `
    <button class="cert" type="button" data-img="${esc(c.img)}" data-title="${esc(c.title)}">
      <img src="${esc(thumb(c.img))}" alt="">
      <span><b>${esc(c.title)}</b><br><small>${esc(c.issuer)}</small></span>
      <code>${esc(((c.details||[]).find(d=>d.mono)||{}).value||'')}</code>
    </button>`).join('');
  s.innerHTML = `
    <h2 class="reveal">作品</h2>
    <p class="prose reveal">${esc(cfg.profile.bio)}</p>
    <article class="work-feature reveal">
      <div>
        <h3>${esc(g.title)}</h3>
        <p>${esc(g.description)}</p>
        <button class="btn" type="button" id="play">${esc(g.button)}</button>
      </div>
      <ul class="facts">${(g.tags||[]).map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    </article>
    <div class="skills reveal">${skills}</div>
    <div class="docs reveal">${docs}</div>
    <div class="certs">${certs}</div>`;
  return s;
}

function life(cfg){
  const s = el('section','wrap');
  s.id = 'life';
  const photos = (cfg.about.fitness && cfg.about.fitness.photos) || [];
  const order = [2,1,0].map(i => photos[i]).filter(Boolean);
  const [main, ...rest] = order;
  const fig = photo => photo ? `<figure class="shot"><img src="${esc(photo.src)}" srcset="${esc(photo.srcset||'')}" sizes="${esc(photo.sizes||'(max-width:860px) 100vw, 36vw')}" alt="${esc(photo.alt||'喜欢健身')}"></figure>` : '';
  s.innerHTML = `
    <div class="life-head">
      <h2 class="reveal">${esc((cfg.about.fitness && cfg.about.fitness.label) || '喜欢健身')}</h2>
    </div>
    <div class="life-grid reveal">
      ${fig(main)}
      <div class="life-side">${rest.map(fig).join('')}</div>
    </div>`;
  return s;
}

function experience(cfg){
  const s = el('section','wrap');
  s.id = 'experience';
  const items = cfg.experience.map(item => {
    let desc = esc(item.description);
    if(item.highlight) desc = desc.replace(esc(item.highlight), `<strong>${esc(item.highlight)}</strong>`);
    return `<li>
      <time>${esc(item.date||'')}</time>
      <div>
        <h3>${esc(item.title)}</h3>
        <p class="org">${esc(item.org)}${item.pill?` · ${esc(item.pill.label)}`:''}</p>
        <p>${desc}</p>
      </div>
    </li>`;
  }).join('');
  const honors = (cfg.honors||[]).map(h=>esc(h.title)).join(' · ');
  const evidence = (cfg.certificates.gallery||[]).map(item => `
    <button class="doc" type="button" data-img="${esc(item.img)}" data-title="${esc(item.title)}">
      <img src="${esc(thumb(item.img))}" alt="${esc(item.title)}">
      <figcaption>${esc(item.title)}</figcaption>
    </button>`).join('');
  s.innerHTML = `
    <h2 class="reveal">经历</h2>
    <ul class="path">${items}</ul>
    <p class="honors reveal">${honors}</p>
    <div class="evidence reveal">${evidence}</div>`;
  return s;
}

function contact(cfg){
  const s = el('section','wrap');
  s.id = 'contact';
  const p = cfg.profile;
  s.innerHTML = `
    <h2 class="reveal">联系</h2>
    <p class="prose reveal">${esc(p.status)}</p>
    <div class="contact-links reveal">
      <a href="tel:${esc(p.phone)}"><span><small>电话</small><br><strong>${esc(p.phone)}</strong></span><span>拨打</span></a>
      <a href="mailto:${esc(p.email)}"><span><small>邮箱</small><br><strong>${esc(p.email)}</strong></span><span>写信</span></a>
    </div>`;
  return s;
}

function footer(cfg){
  const f = el('footer','wrap');
  f.textContent = cfg.footer.copyright || '';
  return f;
}

function observe(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const nodes = [...document.querySelectorAll('.reveal, .meter')];
  if(reduce){
    nodes.forEach(n => n.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(!e.isIntersecting) return;
      requestAnimationFrame(() => requestAnimationFrame(() => e.target.classList.add('in')));
      io.unobserve(e.target);
    });
  }, {threshold:0.18});
  nodes.forEach(n => io.observe(n));
}

function bind(cfg){
  const nav = $('#nav');
  const menu = $('#menu');
  const btn = $('.menu-btn');
  btn.addEventListener('click', () => {
    const open = menu.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  menu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  }));
  const links = [...document.querySelectorAll('.nav-links a')];
  const sections = ['about','work','life','experience','contact'].map(id => document.getElementById(id));
  const onScroll = () => {
    nav.classList.toggle('scrolled', window.scrollY > 8);
    let current = '';
    sections.forEach(sec => { if(sec && window.scrollY >= sec.offsetTop - 120) current = sec.id; });
    links.forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#'+current ? 'true' : 'false'));
  };
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  $('#play').addEventListener('click', () => openGame(cfg.game));
  document.body.addEventListener('click', e => {
    const t = e.target.closest('[data-img]');
    if(t) openImage(t.dataset.img, t.dataset.title);
  });
  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if(e.target.id==='modal') closeModal(); });
  document.addEventListener('keydown', e => {
    if(e.key!=='Escape') return;
    closeModal();
    menu.classList.remove('open');
    btn.setAttribute('aria-expanded','false');
  });
}

function openGame(game){
  $('#modalTitle').textContent = game.title;
  const frame = $('#modalFrame');
  const img = $('#modalImg');
  img.hidden = true;
  frame.hidden = false;
  frame.src = game.src;
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modalClose').focus();
}
function openImage(src, title){
  $('#modalTitle').textContent = title || '查看';
  const frame = $('#modalFrame');
  const img = $('#modalImg');
  frame.hidden = true;
  frame.src = '';
  img.hidden = false;
  img.src = thumb(src);
  img.alt = title || '';
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('#modalClose').focus();
}
function closeModal(){
  $('#modal').classList.remove('open');
  $('#modalFrame').src = '';
  $('#modalImg').src = '';
  document.body.style.overflow = '';
}

init();
</script>
</body>
